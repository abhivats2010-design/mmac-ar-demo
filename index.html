<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>MMAC Card AR (Demo)</title>
  <meta name="theme-color" content="#E05A1F" />

  <style>
    :root{
      --mmac-orange:#E05A1F;
      --panel-bg: rgba(255,255,255,0.88);
      --panel-border: rgba(255,255,255,0.35);
      --shadow: 0 18px 45px rgba(0,0,0,0.28);
    }
    html,body{height:100%; margin:0; background:#000; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;}

    /* MindAR overlay hide */
    .mindar-ui-overlay{ display:none !important; }

    /* Top hint */
    #hintWrap{
      position:fixed; top:0; left:0; right:0;
      padding: env(safe-area-inset-top) 12px 0 12px;
      display:flex; justify-content:center;
      pointer-events:none;
      z-index: 10;
    }
    #hint{
      margin-top: 10px;
      background: rgba(0,0,0,0.35);
      color:#fff;
      padding:10px 14px;
      border-radius: 12px;
      font-size: 14px;
      letter-spacing: 0.2px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    /* Bottom panel */
    #panelWrap{
      position:fixed;
      left:50%;
      bottom: calc(20px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      width:min(340px, calc(100vw - 24px));
      pointer-events:none;
      opacity:0;
      transition: opacity 180ms ease;
      z-index: 10;
    }
    #panel{
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 14px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    #brand{
      display:flex; align-items:center; justify-content:center;
      gap:10px; margin-bottom: 10px;
      color:#111;
      font-weight: 800;
      letter-spacing: 0.3px;
    }
    #brandBadge{
      width:34px; height:34px;
      border-radius: 10px;
      background: var(--mmac-orange);
      display:flex; align-items:center; justify-content:center;
      color:#fff;
      font-size: 12px;
      font-weight: 900;
    }
    .stack{ display:flex; flex-direction:column; gap:10px; }
    .btn{
      width:100%;
      border:0;
      border-radius: 14px;
      padding: 14px 14px;
      font-weight: 900;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      background: var(--mmac-orange);
      color:#fff;
      box-shadow: 0 10px 22px rgba(224,90,31,0.35);
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      pointer-events:auto;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active{ transform: translateY(1px); }
    #note{ margin-top:10px; color: rgba(0,0,0,0.55); font-size: 12px; text-align:center; }

    /* Start overlay (required for iOS reliability) */
    #startOverlay{
      position:fixed; inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 24px;
      background: radial-gradient(ellipse at center, rgba(0,0,0,0.25), rgba(0,0,0,0.75));
      z-index: 20;
    }
    #startCard{
      width:min(380px, 100%);
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 18px;
      padding: 18px;
      color:#fff;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      text-align:center;
    }
    #startTitle{ font-size: 18px; font-weight: 900; margin-bottom: 8px; }
    #startDesc{ font-size: 13px; opacity:0.9; margin-bottom: 14px; line-height: 1.35; }
    #startBtn{
      width:100%;
      border:0;
      border-radius: 14px;
      padding: 14px 14px;
      font-weight: 900;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      background: var(--mmac-orange);
      color:#fff;
      box-shadow: 0 10px 22px rgba(224,90,31,0.35);
      -webkit-tap-highlight-color: transparent;
    }
    #startBtn:active{ transform: translateY(1px); }
    #startSmall{ font-size: 12px; opacity:0.8; margin-top: 10px; }
  </style>

  <!-- A-Frame + MindAR -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>

<body>
  <!-- START OVERLAY (user gesture required on iOS) -->
  <div id="startOverlay">
    <div id="startCard">
      <div id="startTitle">MMAC Card AR (Demo)</div>
      <div id="startDesc">
        Tap “Start Camera”, then point your camera at the <b>orange back side</b> of the card.
      </div>
      <button id="startBtn" type="button">Start Camera</button>
      <div id="startSmall">Use Safari on iPhone. Not WhatsApp/Instagram in-app browser.</div>
    </div>
  </div>

  <!-- TOP HINT -->
  <div id="hintWrap"><div id="hint">Tap “Start Camera”</div></div>

  <!-- BOTTOM PANEL -->
  <div id="panelWrap" aria-hidden="true">
    <div id="panel">
      <div id="brand">
        <div id="brandBadge">MMAC</div>
        <div>MMAC Design Associates</div>
      </div>

      <div class="stack">
        <button class="btn" id="btnCall" type="button">📞 Call</button>
        <button class="btn" id="btnWA" type="button">💬 WhatsApp</button>
      </div>

      <div id="note">Demo build (no website / no save contact)</div>
    </div>
  </div>

  <!-- AR SCENE -->
  <a-scene
    id="scene"
    mindar-image="imageTargetSrc: targets.mind; autoStart: false; uiLoading: no; uiScanning: no;"
    embedded
    renderer="colorManagement: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >
    <a-assets></a-assets>

    <a-entity id="marker" mindar-image-target="targetIndex: 0"></a-entity>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
      cursor="rayOrigin: mouse"
    ></a-camera>
  </a-scene>

  <script>
    // ======= CONFIG (replace later) =======
    const PHONE_E164 = "+971561166659"; // sample; replace later
    // =====================================

    const panelWrap = document.getElementById('panelWrap');
    const hint = document.getElementById('hint');
    const marker = document.getElementById('marker');
    const startOverlay = document.getElementById('startOverlay');
    const startBtn = document.getElementById('startBtn');
    const sceneEl = document.getElementById('scene');

    function digitsOnly(phone){ return phone.replace(/[^0-9]/g,''); }

    // Buttons
    document.getElementById('btnCall').addEventListener('click', () => {
      const digits = digitsOnly(PHONE_E164);
      window.location.href = `tel:${digits}`;
    });
    document.getElementById('btnWA').addEventListener('click', () => {
      const digits = digitsOnly(PHONE_E164);
      window.location.href = `https://wa.me/${digits}`;
    });

    // Target found/lost
    marker.addEventListener('targetFound', () => {
      panelWrap.style.opacity = '1';
      panelWrap.setAttribute('aria-hidden', 'false');
      hint.textContent = "Card detected ✓";
    });

    marker.addEventListener('targetLost', () => {
      panelWrap.style.opacity = '0';
      panelWrap.setAttribute('aria-hidden', 'true');
      hint.textContent = "Point at the orange back side";
    });

    // Start MindAR only after user click (iOS Safari fix)
    async function startAR() {
      try {
        hint.textContent = "Starting camera…";

        // Wait for A-Frame scene ready
        if (!sceneEl.hasLoaded) {
          await new Promise(res => sceneEl.addEventListener('loaded', res, { once:true }));
        }

        const system = sceneEl.systems["mindar-image-system"];
        if (!system) throw new Error("MindAR system not ready");

        await system.start();

        startOverlay.style.display = "none";
        hint.textContent = "Point at the orange back side";

      } catch (e) {
        console.error(e);
        hint.textContent = "Camera blocked. Open in Safari + allow camera.";
        alert("Camera could not start.\n\n1) Open this link in Safari\n2) Allow camera permission\n3) Make sure the page is HTTPS\n\nThen reload.");
      }
    }

    startBtn.addEventListener('click', startAR);
  </script>
</body>
</html>
