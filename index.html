<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>MMAC Card AR (Demo)</title>
  <meta name="theme-color" content="#E05A1F" />
  <style>
    :root{
      --mmac-orange:#E05A1F;
      --panel-bg: rgba(255,255,255,0.88);
      --panel-border: rgba(255,255,255,0.35);
      --shadow: 0 18px 45px rgba(0,0,0,0.28);
    }
    html,body{height:100%; margin:0; background:#000; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;}
    #ui{
      position:fixed; inset:0;
      display:flex;
      align-items:flex-start;
      justify-content:center;
      pointer-events:none;
      padding: env(safe-area-inset-top) 12px env(safe-area-inset-bottom) 12px;
    }
    #hint{
      margin-top: 10px;
      background: rgba(0,0,0,0.35);
      color:#fff;
      padding:10px 14px;
      border-radius: 12px;
      font-size: 14px;
      letter-spacing: 0.2px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    #panelWrap{
      position:fixed;
      left:50%;
      bottom: calc(20px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      width:min(340px, calc(100vw - 24px));
      pointer-events:none;
      opacity:0;
      transition: opacity 180ms ease;
    }
    #panel{
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 14px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    #brand{
      display:flex; align-items:center; justify-content:center;
      gap:10px; margin-bottom: 10px;
      color:#111;
      font-weight: 700;
      letter-spacing: 0.3px;
    }
    #brandBadge{
      width:34px; height:34px;
      border-radius: 10px;
      background: var(--mmac-orange);
      display:flex; align-items:center; justify-content:center;
      color:#fff;
      font-size: 12px;
      font-weight: 800;
    }
    .btn{
      width:100%;
      border:0;
      border-radius: 14px;
      padding: 14px 14px;
      font-weight: 800;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      background: var(--mmac-orange);
      color:#fff;
      box-shadow: 0 10px 22px rgba(224,90,31,0.35);
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      pointer-events:auto;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active{ transform: translateY(1px); }
    .stack{ display:flex; flex-direction:column; gap:10px; }
    #note{
      margin-top:10px;
      color: rgba(0,0,0,0.55);
      font-size: 12px;
      text-align:center;
    }
    /* Hide default MindAR UI */
    .mindar-ui-overlay{ display:none !important; }
  </style>

  <!-- A-Frame + MindAR (Image tracking) -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>

<body>
  <!-- AR Scene -->
  <a-scene
    mindar-image="imageTargetSrc: targets.mind; autoStart: true; uiLoading: no; uiScanning: no;"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >
    <a-assets></a-assets>

    <!-- Anchor (targetIndex 0 = first image in targets.mind) -->
    <a-entity id="marker" mindar-image-target="targetIndex: 0">
      <!-- subtle floating panel in 3D (optional, light) -->
      <a-entity position="0 0 0.06">
        <a-plane width="0.85" height="0.42" material="color: #FFFFFF; opacity: 0.0; transparent: true"></a-plane>
      </a-entity>
    </a-entity>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
  </a-scene>

  <!-- UI Overlay -->
  <div id="ui">
    <div id="hint">Point your camera at the MMAC card (back side)</div>
  </div>

  <div id="panelWrap" aria-hidden="true">
    <div id="panel">
      <div id="brand">
        <div id="brandBadge">MMAC</div>
        <div>MMAC Design Associates</div>
      </div>

      <div class="stack">
        <button class="btn" id="btnCall" type="button">📞 Call</button>
        <button class="btn" id="btnWA" type="button">💬 WhatsApp</button>
      </div>

      <div id="note">Demo build (no website / no save contact)</div>
    </div>
  </div>

  <script>
    // ======= CONFIG (replace later) =======
    const PHONE_E164 = "+971561166659"; // sample; replace later
    // =====================================

    const panelWrap = document.getElementById('panelWrap');
    const hint = document.getElementById('hint');

    function digitsOnly(phone){
      return phone.replace(/[^0-9]/g,'');
    }

    document.getElementById('btnCall').addEventListener('click', () => {
      // iOS Safari will open dialer
      const digits = digitsOnly(PHONE_E164);
      window.location.href = `tel:${digits}`;
    });

    document.getElementById('btnWA').addEventListener('click', () => {
      // wa.me expects digits only with country code
      const digits = digitsOnly(PHONE_E164);
      window.location.href = `https://wa.me/${digits}`;
    });

    // MindAR events: target found/lost
    const marker = document.getElementById('marker');

    marker.addEventListener('targetFound', () => {
      panelWrap.style.opacity = '1';
      panelWrap.setAttribute('aria-hidden', 'false');
      hint.textContent = "Card detected ✓";
    });

    marker.addEventListener('targetLost', () => {
      panelWrap.style.opacity = '0';
      panelWrap.setAttribute('aria-hidden', 'true');
      hint.textContent = "Point your camera at the MMAC card (back side)";
    });
  </script>
</body>
</html>
